# render.yaml

services:
  - type: web
    name: restaurante-api
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      PYTHONPATH=. alembic upgrade head
      PYTHONPATH=. python scripts/seed.py
    startCommand: uvicorn restaurante_api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./database.db
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: EMIS_API_URL
        value: https://apis.emis.co.ao
      - key: EMIS_POS_ID
        sync: false
      - key: EMIS_MERCHANT_TOKEN
        sync: false
      - key: EMIS_SUPERVISOR_CARD
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        sync: false