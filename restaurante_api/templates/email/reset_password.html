<!-- templates/email/reset_password.html -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redefinição de Senha</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .code { font-size: 32px; font-weight: bold; letter-spacing: 5px; background: #f4f4f4; padding: 10px; text-align: center; }
        .footer { margin-top: 30px; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Olá, {{ name }}!</h1>
        <p>Recebemos uma solicitação para redefinir sua senha.</p>
        <p>Use o código abaixo para criar uma nova senha:</p>
        <div class="code">{{ token }}</div>
        <p>Este código expira em <strong>30 minutos</strong>.</p>
        <p>Se você não solicitou esta alteração, ignore este email.</p>
        <hr>
        <div class="footer">
            <p>Restaurante Aurora - Seu restaurante de confiança</p>
        </div>
    </div>
</body>
</html>
